<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="view/css/style.css">
    <link rel="icon" href="images/favicon.png">
    <link
        rel="stylesheet"
        type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
        rel="stylesheet"
        type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <title>Fakedex</title>
</head>
<body class="catalog-page" onload="showFakedex()">
    <header>
        <div class="nav-bar container">
            <a href="index.html" class="back-link">
                <i class="ph ph-caret-left"></i>
                <span>Back to entry</span>
            </a>
            <span class="catalog-count">124 species</span>
        </div>
    </header>
    <main class="catalog-main">
        <section class="catalog-hero">
            <span class="eyebrow">Regional archive</span>
            <h1>Meet the Fakedex</h1>
            <p>An illustrated field guide to every discovered species in the region.</p>
        </section>
        <section class="card__section" aria-label="Pokemon catalog"></section>
    </main>
    <script src="view/js/data.js"></script>
    <script>
        function showFakedex() {
            const cardSection = document.querySelector(".card__section");

            pokemons.map((pkmn) => {
                cardSection.innerHTML += `
                <div class="pkmn-card">
                    <span class="pkmn-num">${pkmn.num}</span>
                    <img src=${pkmn.img} alt="pokemon image" class="pkmn-card-img">
                </div>`;
            });
        }
    </script>
</body>
</html>
